# Builds a static preview of the shop and publishes it to GitHub Pages
# on every push to main. A throwaway PostgreSQL database is started just
# for the build, filled with the product data, then discarded.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_db
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/indira-naturals
      ADMIN_SESSION_SECRET: build-only-not-used-on-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Create tables and load products
        run: |
          npx drizzle-kit push --force
          ADMIN_SEED_PASSWORD="$(openssl rand -hex 16)" npx tsx src/db/seed.ts

      - name: Build static site
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
